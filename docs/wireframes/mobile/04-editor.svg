" font-size="15" font-weight="400" fill="#595D63" text-anchor="start" letter-spacing="-0.005em" >할 일과 하위 할 일의 구분 강화</text><text x="40" y="510" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="400" fill="#595D63" text-anchor="start" letter-spacing="-0.005em" >•</text><text x="58" y="510" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="400" fill="#595D63" text-anchor="start" letter-spacing="-0.005em" >작성과 수정은 같은 편집 영역 사용</text><text x="24" y="642" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="400" fill="#595D63" text-anchor="start" letter-spacing="-0.005em" >서식과 이미지를 포함한 내용을</text><text x="24" y="666" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="400" fill="#595D63" text-anchor="start" letter-spacing="-0.005em" >그대로 저장해요.</text><rect x="0" y="728" width="390" height="116" rx="0" fill="#FFFFFF" stroke="none" /><line x1="0" y1="728" x2="390" y2="728" stroke="#CFD2D6" /><rect x="16" y="752" width="108" height="56" rx="8" fill="#F7F8F9" stroke="none" /><text x="70.0" y="786.0" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="middle" letter-spacing="-0.005em" >취소</text><rect x="136" y="752" width="238" height="56" rx="8" fill="#202124" stroke="none" /><text x="255.0" y="786.0" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.005em" >변경 저장</text></svg>
