<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Daily Routine 회원가입 데스크톱 디자인</title>
<desc id="desc">Google 인증 후 회원 정보가 없는 사용자의 닉네임 입력, 선택적 프로필 사진 변경, 가입 완료 화면. 블루와 쿨 그레이, Pretendard, 평면 카드와 둥근 컨트롤을 적용한 시각 디자인.</desc>
