R, sans-serif" font-size="18" font-weight="400" fill="#4E5968" text-anchor="start" letter-spacing="-0.005em">프로필 사진은 나중에 바꿔도 괜찮아요.</text><rect x="104" y="536" width="472" height="160" rx="24" fill="#FFFFFF" stroke="none" /><rect x="128" y="562" width="32" height="32" rx="16" fill="#3182F6" stroke="none" /><svg x="134" y="568" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" color="#FFFFFF"><path d="m5 12 4 4 10-10" /></svg><text x="180" y="584" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#191F28" text-anchor="start" letter-spacing="-0.005em">Google 계정 연결</text><text x="548" y="584" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="400" fill="#4E5968" text-anchor="end" letter-spacing="-0.005em">완료</text><line x1="144" y1="602" x2="144" y2="622" stroke="#3182F6" /><rect x="128" y="630" width="32" height="32" rx="16" fill="#FFFFFF" stroke="#1065CC" /><text x="144" y="652" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="600" fill="#1065CC" text-anchor="middle" letter-spacing="-0.005em">2</text><text x="180" y="652" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#1065CC" text-anchor="start" letter-spacing="-0.005em">회원 정보 입력</text><text x="548" y="652" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="400" fill="#1065CC" text-anchor="end" letter-spacing="-0.005em">마지막 단계</text><rect x="752" y="136" width="560" height="676" rx="24" fill="#FFFFFF" stroke="none" /><text x="792" y="205" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#191F28" text-anchor="start" letter-spacing="-0.02em">회원가입</text><text x="792" y="244" font-