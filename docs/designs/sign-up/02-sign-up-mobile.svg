ard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="400" fill="#4E5968" text-anchor="start" letter-spacing="-0.005em">Google로 인증한 계정</text><text x="84" y="280" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="500" fill="#191F28" text-anchor="start" letter-spacing="-0.005em">jiyoung@example.com</text><rect x="24" y="332" width="64" height="64" rx="32.0" fill="#E8F3FF" stroke="none" /><svg x="40.0" y="346.72" width="32.0" height="32.0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" color="#1065CC"><circle cx="12" cy="8" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg><text x="108" y="346" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#191F28" text-anchor="start" letter-spacing="-0.005em">프로필 사진</text><text x="196" y="346" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="400" fill="#4E5968" text-anchor="start" letter-spacing="-0.005em">선택</text><rect x="108" y="360" width="112" height="44" rx="12" fill="#F2F4F6" stroke="none" /><text x="164.0" y="388.0" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#191F28" text-anchor="middle" letter-spacing="-0.005em">사진 선택</text><text x="24" y="432" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="400" fill="#4E5968" text-anchor="start" letter-spacing="-0.005em">PNG, JPG, WebP, GIF · 최대 5MB</text><text x="24" y="478" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" font-weight="600" fill="#191F28" text-anchor="start" letter-spacing="-0.005em">닉네임</text><text x="82" y="478" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="400" fill="#1065CC" text-