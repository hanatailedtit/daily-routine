<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Daily Routine 회원가입 모바일 디자인</title>
<desc id="desc">모바일 웹의 단일 열 가입 폼. Google 인증 계정, 선택적 사진, 필수 닉네임, 가입 완료 버튼. 블루와 쿨 그레이, Pretendard, 평면 카드와 둥근 컨트롤을 적용한 시각 디자인.</desc>
